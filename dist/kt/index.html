<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="">
<title>Loading... | HK Recreation Status</title>
<style>
:root{
  --primary:#0EA5E9;--primary-dark:#0284C7;--secondary:#10B981;--accent:#F97316;
  --status-open:#22C55E;--status-closed:#EF4444;--status-maint:#F59E0B;--status-sus:#6B7280;
  --bg-page:#F8FAFC;--bg-card:#fff;--text-1:#1E293B;--text-2:#64748B;--border:#E2E8F0;
  --brand:#1e3a8a;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC","Microsoft JhengHei",sans-serif;background:var(--bg-page);color:#333;line-height:1.6;padding-top:80px}
.container{max-width:800px;margin:0 auto;padding:0 16px}
.top-bar{position:fixed;top:0;left:0;right:0;height:24px;background:var(--brand);color:#fff;display:flex;justify-content:space-between;align-items:center;padding:0 16px;font-size:.68rem;z-index:1002}
.top-bar span{white-space:nowrap}
.thunder-banner{display:none;position:fixed;top:24px;left:0;right:0;background:linear-gradient(135deg,#facc15,#f97316);color:#422006;font-weight:700;font-size:.78rem;padding:6px 16px;z-index:1003;text-align:center;animation:thunder-flash 3s ease-in-out infinite;overflow-wrap:break-word;word-wrap:break-word;white-space:normal;line-height:1.4}
@keyframes thunder-flash{0%,100%{opacity:1}50%{opacity:.85}}
.nav-bar{position:fixed;top:24px;left:0;right:0;background:rgba(255,255,255,.97);backdrop-filter:blur(8px);border-bottom:1px solid var(--border);z-index:1001;padding:6px 16px}
section{scroll-margin-top:64px}
.nav-inner{max-width:800px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:8px}
.nav-title{font-weight:700;color:var(--brand);font-size:.95rem;white-space:nowrap}
.lang-switch{display:flex;gap:4px}
.lang-btn{padding:4px 10px;border-radius:6px;font-size:.75rem;font-weight:500;text-decoration:none;color:var(--text-2);background:#f1f5f9;border:1px solid var(--border);cursor:pointer}
.lang-btn.active{background:var(--brand);color:#fff;border-color:var(--brand)}
header{display:none}
header p{color:var(--text-2);font-size:.85rem;margin-top:4px}

.card{background:var(--bg-card);border-radius:14px;box-shadow:0 2px 10px rgba(0,0,0,.06);margin:8px 0;overflow:hidden;border:1px solid var(--border);transition:transform .18s ease,box-shadow .18s ease,opacity .3s ease}
.card:hover{transform:translateY(-4px);box-shadow:0 10px 24px rgba(0,0,0,.10)}
@keyframes cardIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.card{animation:cardIn .35s ease both}
.card.collapsed .facility-body{display:none}
.card .expand-hint{font-size:.72rem;color:var(--text-2);font-weight:500;margin-left:6px}
.card.collapsed .expand-hint::after{content:attr(data-expand)}
.card:not(.collapsed) .expand-hint::after{content:attr(data-collapse)}
.facility-header{padding:14px 16px;background:#f8fafc;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;gap:8px;cursor:pointer}
.facility-header:hover{background:#f1f5f9}
.facility-name{font-size:1rem;font-weight:700;color:var(--text-1)}
.facility-address{font-size:.75rem;color:var(--text-2);margin-top:2px}
.status-badge{padding:5px 12px;border-radius:999px;font-size:.75rem;font-weight:600;white-space:nowrap}
.status-open{background:#dcfce7;color:#166534}
.status-upcoming{background:#f0fdf4;color:#15803d;border:1px solid #bbf7d0;animation:breathe 2s ease-in-out infinite}
.status-closed{background:#fee2e2;color:#991b1b;border:1px solid #fecaca}
.status-maint{background:#fef3c7;color:#92400e;border:1px solid #fcd34d}
@keyframes breathe{0%,100%{opacity:1}50%{opacity:.4}}
.status-partial{background:#fef3c7;color:#92400e}
.status-suspended{background:#fee2e2;color:#991b1b;border:1px solid #fecaca}
.code-m{background:#dc2626;color:#fff;padding:2px 6px;border-radius:4px;font-size:.7rem;font-weight:600}
.code-b{background:#fecaca;color:#991b1b;padding:2px 6px;border-radius:4px;font-size:.7rem;font-weight:600}
.code-a{background:#dcfce7;color:#166534;padding:2px 6px;border-radius:4px;font-size:.7rem;font-weight:600}
.code-l{background:#fef3c7;color:#92400e;padding:2px 6px;border-radius:4px;font-size:.7rem;font-weight:600}
.code-a-active{background:#dcfce7;color:#166534;padding:2px 6px;border-radius:4px;font-size:.7rem;font-weight:600;border:2px solid #166534;animation:breathe 2s ease-in-out infinite}
.code-expired{background:#e2e8f0;color:#94a3b8;padding:2px 6px;border-radius:4px;font-size:.7rem;font-weight:600}
.facility-body{padding:12px 16px}
.detail-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #f1f5f9;font-size:.85rem}
.detail-row:last-child{border-bottom:none}
.detail-label{color:var(--text-2)}
.schedule-section{margin-top:12px;padding-top:12px;border-top:1px solid var(--border)}
.schedule-title{font-weight:600;color:#374151;margin-bottom:8px;font-size:.9rem;cursor:pointer;display:flex;justify-content:space-between;align-items:center}
.schedule-title::after{content:'▾';transition:transform .2s}
.collapsed .schedule-title::after{transform:rotate(-90deg)}
.session{display:flex;justify-content:space-between;padding:6px 0;font-size:.82rem;align-items:center}
.session-time{color:#475569}
.session-status{padding:3px 8px;border-radius:999px;font-size:.7rem;font-weight:600}
.session-status.soon{background:#f0fdf4;color:#15803d;border:1px solid #bbf7d0;animation:breathe 2s ease-in-out infinite}
.session-status.open{background:#166534;color:#fff}
.session-status.maint{background:#fef3c7;color:#92400e;border:1px solid #fcd34d}
.session-status.done{background:#f1f5f9;color:#94a3b8}
.session-status.suspended{background:#fef3c7;color:#92400e;border:1px solid #fcd34d}
.session-bar{height:4px;border-radius:2px;margin-top:4px;width:100%;background:#f1f5f9}
.session-bar.open{background:var(--status-open)}
.session-bar.soon{background:var(--status-maint)}
.session-bar.suspended{background:var(--status-sus)}
.session-bar.done{background:#e2e8f0}
.notice{background:#fef3c7;border:1px solid #fcd34d;border-radius:8px;padding:10px;margin-top:12px;font-size:.78rem;color:#92400e}
.section-title{font-size:1.1rem;font-weight:700;color:var(--text-1);margin:12px 0 6px;padding-bottom:6px;border-bottom:2px solid var(--border);display:flex;justify-content:space-between;align-items:center;cursor:pointer}
.section-title .toggle{font-size:.9rem;color:var(--text-2)}
.collapsible .section-content{display:block}
.collapsible.collapsed .section-content{display:none}
.collapsible.collapsed .section-title .toggle::after{content:attr(data-expand)}
.collapsible .section-title .toggle::after{content:attr(data-collapse)}
.index-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0;position:sticky;top:88px;z-index:900;background:rgba(248,250,252,.95);backdrop-filter:blur(6px);padding:8px 0;border-radius:12px}
.index-item{padding:10px 12px;background:#fff;border:1px solid var(--border);border-radius:8px;font-size:.82rem;color:var(--brand);text-decoration:none;text-align:center;box-shadow:0 1px 4px rgba(0,0,0,.04);transition:transform .15s ease,box-shadow .15s ease}
.index-item:hover{background:var(--brand);color:#fff;transform:translateY(-2px);box-shadow:0 4px 10px rgba(30,58,138,.25)}
.rvm-card{background:var(--bg-card);border-radius:14px;box-shadow:0 2px 10px rgba(0,0,0,.06);margin:12px 0;padding:16px;border:1px solid var(--border);transition:transform .18s ease,box-shadow .18s ease}
.rvm-card:hover{transform:translateY(-4px);box-shadow:0 10px 24px rgba(0,0,0,.10)}
.rvm-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rvm-item{display:flex;flex-direction:column;justify-content:space-between;padding:12px;border:1px solid #f1f5f9;border-radius:10px;gap:8px;background:#fafafa}
.rvm-info{flex:1}
.rvm-name{font-weight:600;color:var(--text-1);font-size:.85rem}
.rvm-address{font-size:.7rem;color:var(--text-2);margin-top:2px;line-height:1.4}
.rvm-hours{font-size:.7rem;color:#475569;margin-top:2px}
.rvm-status{padding:4px 10px;border-radius:999px;font-size:.7rem;font-weight:600;white-space:nowrap;height:fit-content}
.rvm-status-operating{background:#dcfce7;color:#166534}
.rvm-status-nearly-full{background:#fef3c7;color:#92400e}
.rvm-status-full{background:#fee2e2;color:#991b1b}
.rvm-status-maintenance{background:#e0e7ff;color:#3730a3}
.rvm-sync{text-align:right;font-size:.68rem;color:#94a3b8;margin-top:10px;padding-top:8px;border-top:1px solid var(--border)}
.updated{text-align:center;color:#94a3b8;font-size:.7rem;margin:12px 0 16px}
.back-to-top{position:fixed;bottom:20px;right:16px;width:44px;height:44px;border-radius:50%;background:var(--brand);color:#fff;border:none;cursor:pointer;box-shadow:0 4px 12px rgba(30,58,138,.4);display:none;align-items:center;justify-content:center;z-index:999}
.back-to-top.visible{display:flex}
@media(max-width:640px){.index-grid{grid-template-columns:1fr 1fr;top:70px}.facility-header{padding:12px}.facility-body{padding:10px 12px}.rvm-item{flex-direction:column}}

.refresh-btn {
  display: inline-block;
  padding: 10px 24px;
  font-size: 0.85rem;
  font-weight: 600;
  background: #3b82f6;
  color: white;
  border: none;
  border-radius: 8px;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
  cursor: pointer;
  transition: background 0.2s, transform 0.1s;
  font-family: inherit;
}
.refresh-btn:hover { background: #2563eb; }
.refresh-btn:active { transform: scale(0.97); background: #1d4ed8; }
</style>
</head>
<body>
<div class="top-bar"><span id="topDate"></span><span id="topWeather"></span></div>
<div class="thunder-banner" id="thunderBanner">⛈</div>
<nav class="nav-bar"><div class="nav-inner"><div class="nav-title" id="navTitle"></div><div class="lang-switch"><a href="#" class="lang-btn active" data-lang="zh">繁體</a><a href="#" class="lang-btn" data-lang="en">EN</a><a href="#" class="lang-btn" data-lang="cn">简体</a></div></div></nav>

<script>
// === WEATHER MODULE (HKO Open Data API) ===
let severeWarnings=[],severeWarningsEn=[],thunderWarnings=[],thunderWarningsEn=[];
var currentLang=window.currentLang||'zh';
function wWarn(){return currentLang==='en'?{severe:severeWarningsEn,thunder:thunderWarningsEn}:{severe:severeWarnings,thunder:thunderWarnings}}
(function(){
  const API='https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=rhrread&lang=tc';
  const WARN_API_TC='https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=warningInfo&lang=tc';
  const WARN_API_EN='https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=warningInfo&lang=en';
  const ICON_BASE='https://d28gfsrd1pujc.cloudfront.net/frontend_images/mod_sp_weather/images/';
  function parseSevere(wd){
    const out=[];
    // New API format: wd.details[] with warningStatementCode
    if(wd&&wd.details&&Array.isArray(wd.details)){
      for(const d of wd.details){
        const code=d.warningStatementCode||'';
        const stmt=((d.contents||[]).join('\n'))||'';
        if(!stmt||stmt.includes('取消')||stmt.includes('cancelled')) continue;
        // T1/T3 standby signals
        if(code==='WTCSGNL'){
          const m=stmt.match(/(一號戒備信號|三號強風信號|八號.*?信號|九號.*?信號|十號.*?信號)/);
          if(m) out.push(m[1]);
        }
        // Black rainstorm
        if(code==='WRAINSA' || stmt.includes('黑色暴雨')) out.push('黑色暴雨警告');
      }
    }
    // Legacy format fallback
    const warns=wd&&wd.warnings?wd.warnings:{};
    for(const k in warns){const w=warns[k];if(!w)continue;if(w.status&&(w.status.includes('取消')||w.status.includes('cancelled')))continue;const name=w.name||'';if(/八號|九號|十號/.test(name)||name.includes('黑色暴雨')||/Signal No\\. (8|9|10)/.test(name)||name.includes('Black Rainstorm'))out.push(name);}
    return [...new Set(out)];
  }
  function parseThunder(wd){
    const out=[];
    if(wd&&wd.details&&Array.isArray(wd.details)){for(const d of wd.details){const code=d.warningStatementCode||'';const stmt=(d.contents&&d.contents[0])||'';if(code==='WTS'||stmt.includes('雷暴')||stmt.includes('Thunderstorm')){if(!stmt.includes('取消')&&!stmt.includes('cancelled')){const m=stmt.match(/有效時間(?:延長)?至([^，。]*)/)||stmt.match(/until ([^,;.]*(?:\.m\.)?[^,;.]*)/i);const isEn=/[A-Za-z]/.test(stmt);const valid=m?(isEn?` (until ${m[1]})`:`（至${m[1]}）`):'';out.push(isEn?('Thunderstorm Warning'+valid):('雷暴警告'+valid));}}}}
    const warns=wd&&wd.warnings?wd.warnings:{};for(const k in warns){const w=warns[k];if(!w)continue;if(w.status&&(w.status.includes('取消')||w.status.includes('cancelled')))continue;const name=w.name||'';if(/八號|九號|十號/.test(name)||name.includes('黑色暴雨')||name.includes('雷暴')||name.includes('Thunderstorm'))out.push(name);}
    return out;
  }
  function renderTopWeather(icon,t,h){
    const el=document.getElementById('topWeather');if(!el)return;
    const w=wWarn();let warnHtml='';
    if(w.severe.length){warnHtml+=`<span style="margin-left:8px;color:#fecaca;background:#991b1b;padding:1px 6px;border-radius:4px;font-size:.6rem;font-weight:600">⚠ ${w.severe.join('、')}</span>`;}
    if(w.thunder.length){warnHtml+=`<span style="margin-left:8px;display:inline-flex;align-items:center;gap:3px;background:#facc15;color:#713f12;padding:2px 8px;border-radius:4px;font-size:.65rem;font-weight:700;border:1px solid #eab308"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:middle"><path d="M19 16.9A5 5 0 0 0 18 7h-1.26a8 8 0 1 0-11.62 9"/><polyline points="13 11 9 17 15 17 11 23"/></svg> ${w.thunder.join('、')}</span>`;}
    el.innerHTML=`<img src="${ICON_BASE}weather_${icon}.png" alt="" style="height:16px;vertical-align:middle;margin-right:4px"><span style="font-weight:700">${t??'--'}°C</span><span style="opacity:.8;margin-left:6px">💧${h??'--'}%</span>${warnHtml}`;
  }
  async function fetchWeather(){
    try{const r=await fetch(API);const d=await r.json();const temps=(d.temperature?.data)||[];const hums=(d.humidity?.data)||[];const t=(temps.find(x=>x.place==='香港天文台')||temps[0]||{}).value;const h=(hums.find(x=>x.place==='香港天文台')||hums[0]||{}).value;const icon=(d.icon&&d.icon[0])||'50';renderTopWeather(icon,t,h);}catch(e){const el=document.getElementById('topWeather');if(el)el.textContent='天氣資料暫不可用';}
    try{const[w1,w2]=await Promise.all([fetch(WARN_API_TC),fetch(WARN_API_EN)]);const[wd1,wd2]=await Promise.all([w1.json(),w2.json()]);severeWarnings=parseSevere(wd1);severeWarningsEn=parseSevere(wd2);thunderWarnings=parseThunder(wd1);thunderWarningsEn=parseThunder(wd2);}catch(e){severeWarnings=[];severeWarningsEn=[];thunderWarnings=[];thunderWarningsEn=[];}
    // 警示載入後重繪右上角（T1 等信號）
    try{const r2=await fetch(API);const d2=await r2.json();const temps2=(d2.temperature?.data)||[];const hums2=(d2.humidity?.data)||[];const t2=(temps2.find(x=>x.place==='香港天文台')||temps2[0]||{}).value;const h2=(hums2.find(x=>x.place==='香港天文台')||hums2[0]||{}).value;const icon2=(d2.icon&&d2.icon[0])||'50';renderTopWeather(icon2,t2,h2);}catch(e){}
    const banner=document.getElementById('thunderBanner');if(banner){const w=wWarn();if(w.thunder.length){banner.style.display='block';const suffix=currentLang==='en'?' — Pools may close':' — 泳池可能暫停開放';banner.innerHTML=`<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:middle;margin-right:4px"><path d="M19 16.9A5 5 0 0 0 18 7h-1.26a8 8 0 1 0-11.62 9"/><polyline points="13 11 9 17 15 17 11 23"/></svg> ⛈ ${w.thunder.join('、')}${currentLang==='en'?' in effect':'生效中'}${suffix}`;const _bh=banner.offsetHeight;document.querySelector('.nav-bar').style.top=_bh+'px';document.body.style.paddingTop=(_bh+24)+'px';}else{banner.style.display='none';document.querySelector('.nav-bar').style.top='24px';document.body.style.paddingTop='80px';}}
    if(typeof renderLibraries==='function'){const lb=document.getElementById('libraries');if(lb)lb.innerHTML=renderLibraries();}
    if(typeof renderPools==='function'){const fc=document.getElementById('pools');if(fc)fc.innerHTML=renderPools();}
  }
  fetchWeather();setInterval(fetchWeather,600000);
})();
</script>

function addr(f){const zh=f.address||'';const en=f.addrEn||zh;const a=currentLang==='en'?en:(currentLang==='cn'?(f.addrCn||zh):zh);const q=encodeURIComponent(zh);return`<a href="https://www.google.com/maps/search/?api=1&query=${q}" target="_blank" rel="noopener" style="color:inherit;text-decoration:none;border-bottom:1px dotted #94a3b8">${a} <small style="font-size:.6rem">📍</small></a>`;}
function addrRVM(r){const q=encodeURIComponent(r.addr);const a=currentLang==='en'?(r.addrEn||r.addr):r.addr;return`<a href="https://www.google.com/maps/search/?api=1&query=${q}" target="_blank" rel="noopener" style="color:inherit;text-decoration:none;border-bottom:1px dotted #94a3b8">${a}</a>`;}

// === CORE LOGIC ===
const HK_HOLIDAYS=DD.holidays||[];
function hkNow(){return new Date()}
function hkMinutes(d){return d.getHours()*60+d.getMinutes()}
function parseRange(s){if(!s)return null;if(s.includes("24小時"))return{start:0,end:1440};let m=s.match(/(\d{1,2}):(\d{2})\s*-\s*(\d{1,2}):(\d{2})/);if(!m)return null;let sh=parseInt(m[1]),sm=parseInt(m[2]),eh=parseInt(m[3]),em=parseInt(m[4]);let isPM=s.includes("下午")||s.includes("晚上")||s.includes("傍晚")||s.includes("晚");let isNoon=s.includes("中午");if(isPM){if(sh!==12&&sh<12)sh+=12;if(eh!==12&&eh<12)eh+=12;}else if(isNoon){if(sh===12)sh=12;if(eh<12)eh+=12;}let start=sh*60+sm,end=eh*60+em;if(end<=start)end=1440;return{start:start,end:end}}
function sessionStatus(range,nowM){if(!range)return{text:"—",cls:"done"};if(nowM<range.start)return{text:t('soon'),cls:"soon"};if(nowM>=range.start&&nowM<range.end)return{text:t('open'),cls:"open"};return{text:t('done'),cls:"done"};}
function facilityOverallStatus(sessions,nowM){let hasOpen=false,hasSoon=false;for(let s of sessions){let r=parseRange(s);let st=sessionStatus(r,nowM);if(st.cls==="open")hasOpen=true;if(st.cls==="soon")hasSoon=true;}if(hasOpen)return{text:t('open'),cls:"status-open"};if(hasSoon)return{text:t('soon'),cls:"status-upcoming"};return{text:t('closed'),cls:"status-closed"};}
function toggleCard(el){el.parentElement.classList.toggle('collapsed')}
function parseMaintNote(note){const m=note.match(/保養日\((.+?)及(.+?)個(.+?) ([0-9:]+)-([0-9]+)\)首節改 ([0-9:]+)/);if(!m)return null;const ord={第一:1,第二:2,第三:3,第四:4};const wd={星期一:1,星期二:2,星期三:3,星期四:4,星期五:5,星期六:6,星期日:0};const toMin=s=>{const[h,mm]=s.split(':').map(Number);return h*60+mm;};return{weeks:[ord[m[1]],ord[m[2]]],weekday:wd[m[3]],winEnd:toMin(m[5]),shift:toMin(m[6])};}
function isMaintDay(obj,date){if(!obj)return false;const d=date||new Date();if(d.getDay()!==obj.weekday)return false;const off=(obj.weekday-new Date(d.getFullYear(),d.getMonth(),1).getDay()+7)%7;const occ=1+Math.floor((d.getDate()-(1+off))/7);return obj.weeks.includes(occ);}
function inMaintenance(m,now){const y=now.getFullYear();const[sm,sd]=m.start.split('/').map(Number);const[em,ed]=m.end.split('/').map(Number);const d=now.getDate(),mo=now.getMonth()+1;if(m.nextYear){if(mo>sm||(mo===sm&&d>=sd)||mo<em||(mo===em&&d<=ed))return true;}else{if(mo>sm||(mo===sm&&d>=sd)){if(mo<em||(mo===em&&d<=ed))return true;}else if(mo===em&&d<=ed)return true;}return false;}
function isCleaningDay(cleaning,now){if(!cleaning||!cleaning.day)return false;const CN=['日','一','二','三','四','五','六'];const todayCN=CN[now.getDay()];if(todayCN===cleaning.day)return true;if(cleaning.fallback&&todayCN===cleaning.fallback){const wd={'一':1,'二':2,'三':3,'四':4,'五':5};const w=wd[cleaning.day];if(w==null)return false;const y=now.getFullYear(),m=now.getMonth();for(let d=1;d<=31;d++){const dt=new Date(y,m,d);if(dt.getMonth()!==m)break;if(dt.getDay()===w){const ds=`${y}/${String(m+1).padStart(2,'0')}/${String(d).padStart(2,'0')}`;if(HK_HOLIDAYS.includes(ds))return true;}}}return false;}
function poolSubStatuses(f,todayStr,now){let closedSet=new Set(),reasonMap={};const nm=hkMinutes(now);if(f.closures){f.closures.filter(c=>c.date===todayStr).forEach(c=>{const r=parseRange(c.time);if(r&&nm<r.end){const reason=currentLang==='en'?(c.reasonEn||c.reason):c.reason;c.pools.split(/[,，]/).map(s=>s.trim()).forEach(p=>{closedSet.add(p);reasonMap[p]=reason;});}});}if(f.maintenance){const alias=f.id==='ktswim'?{'戶外泳池':['副池','日光浴場'],'室內泳池':['主池','訓練池','習泳池 1&2']}:{};if(f.id==='ltswim'||f.id==='jvswim')alias['全場']=f.facilities?f.facilities.map(x=>x.name):[];f.maintenance.forEach(m=>{if(inMaintenance(m,now)){const targets=alias[m.pool]||[m.pool];targets.forEach(p=>closedSet.add(p));}});}let cleaningActive=false;if(f.cleaning&&isCleaningDay(f.cleaning,now)){const CLEAN_START=10*60;let cleanEnd=18*60;if(f.sessions&&f.sessions[1]){const r2=parseRange(f.sessions[1]);if(r2)cleanEnd=r2.end;}if(nm>=CLEAN_START&&nm<cleanEnd){(f.facilities||[]).forEach(x=>closedSet.add(x.name));cleaningActive=true;}}return(f.facilities||[]).map(x=>{if(closedSet.has(x.name)){return{...x,status:'closed',note:reasonMap[x.name]?`${t('closureReason')} ${reasonMap[x.name]}`:(cleaningActive?t('cleaningNote'):t('closedNote'))};}return x;});}
function officialLink(url,labelKey){return url?`<a href="${url}" target="_blank" rel="noopener" style="display:block;text-align:center;margin-top:12px;padding:8px;background:#f8fafc;border:1px solid #e2e8f0;border-radius:8px;font-size:.78rem;color:#1e3a8a;text-decoration:none">${t(labelKey)}</a>`:'';}

function renderPools(){
  const now=hkNow(),nm=hkMinutes(now);
  const FSTATUS={open:{t:t('open'),c:'open'},soon:{t:t('soon'),c:'soon'},maintenance:{t:t('maint'),c:'done'},closed:{t:t('closed_today'),c:'suspended'}};
  const todayStr=now.toISOString().slice(0,10).replace(/-/g,'/');
  const pools=DD.pools||[];
  return pools.map(f=>{
    const sessions=f.sessions||(f.schedule&&f.schedule.summer&&f.schedule.summer.map(x=>x.time))||[];
    let st=facilityOverallStatus(sessions,nm);
    let weatherHtml='';const ww=wWarn();if(ww.severe.length||ww.thunder.length){const allWarnings=[...ww.severe,...ww.thunder];weatherHtml=`<div class="notice" style="background:#fee2e2;border-color:#fecaca;color:#991b1b">⚠️ ${t('weatherWarn')}：${allWarnings.join('、')} — ${currentLang==='en'?'Pool may close':currentLang==='cn'?'泳池可能暫停開放':'泳池可能暫停開放'}</div>`;}
    let closureHtml=weatherHtml;
    if(f.closures){closureHtml+=f.closures.filter(c=>{if(c.date>todayStr)return true;if(c.date!==todayStr)return false;const cr=parseRange(c.time);return cr&&nm<cr.end}).map(c=>{const p=currentLang==='en'?(c.poolsEn||c.pools):c.pools;const r=currentLang==='en'?(c.reasonEn||c.reason):c.reason;return`<div class="notice" style="background:#fee2e2;border-color:#fecaca;color:#991b1b">⚠️ ${t('closure')}（${c.date} ${c.time}）：${p} — ${t('closureReason')} ${r}</div>`}).join('');}
    if(f.cleaning&&isCleaningDay(f.cleaning,now)){closureHtml+=`<div class="notice" style="background:#e0e7ff;border-color:#c7d2fe;color:#3730a3">🧹 ${t('cleaningDay')}（${f.cleaning.day}${f.cleaning.fallback?' → '+f.cleaning.fallback:''}）</div>`;}
    let subPools=poolSubStatuses(f,todayStr,now);
    const subPoolAllClosed=subPools.length>0&&subPools.every(x=>x.status==='closed');
    // Unified session rendering: handle both {session,time} objects and plain strings
    let sessHtml=sessions.map(s=>{
      const r=parseRange(typeof s==='string'?s:s.time);
      let ss=sessionStatus(r,nm);
      if(f.cleaning&&isCleaningDay(f.cleaning,now)){const CLEAN_START=10*60;let cleanEnd=18*60;const s2=sessions[1];if(s2){const r2=parseRange(typeof s2==='string'?s2:s2.time);if(r2)cleanEnd=r2.end;}if(r&&r.start<cleanEnd&&r.end>CLEAN_START)ss={text:t('cleaningClosed'),cls:'suspended'};}
      if(f.closures){const crs=f.closures.filter(c=>c.date===todayStr).map(c=>parseRange(c.time)).filter(Boolean);const allAffected=crs.some(cr=>r&&r.start<cr.end&&r.end>cr.start&&nm>=cr.start&&nm<cr.end)&&subPoolAllClosed;if(allAffected&&!ss.cls.startsWith('suspended'))ss={text:t('closed_today'),cls:'suspended'};}
      const label=typeof s==='object'&&s.session?trSession(s.session,currentLang)+' '+trSession(s.time,currentLang):trSession(typeof s==='string'?s:s.time,currentLang);
      return`<div class="session"><span class="session-time">${label}</span><span class="session-status ${ss.cls}">${ss.text}</span></div>`;
    }).join("");
    if(st.cls==="soon"||st.text===t('soon'))subPools=subPools.map(x=>x.status==='open'?{...x,status:'soon'}:x);
    const subClosed=subPools.filter(x=>x.status==='closed').length;
    if(subClosed>0&&subClosed<subPools.length)st={text:t('partial'),cls:"status-partial"};
    else if(subClosed===subPools.length)st={text:t('closed_today'),cls:"status-suspended"};
    if(st.cls==="status-closed"||st.cls==="status-suspended")subPools=subPools.map(x=>({...x,status:'closed',note:x.note||t('closedNote')}));
    let poolsHtml=subPools.map(x=>{let fs=FSTATUS[x.status]||FSTATUS.closed;return`<div class="detail-row" style="flex-direction:column;align-items:flex-start;gap:2px"><div style="display:flex;justify-content:space-between;width:100%;align-items:center"><span class="detail-label">${tl('pool',x.name)} <small style="color:#94a3b8">${x.spec}</small></span><span class="session-status ${fs.c}">${fs.t}</span></div>${x.note?`<small style="color:#92400e;font-size:.75rem;text-align:right;width:100%">${tl('note',x.note)}</small>`:''}</div>`}).join("");
    let official=officialLink(f.officialUrl,'view');
    return`<div class="card collapsed" id="${f.id}"><div class="facility-header" onclick="toggleCard(this)"><div><div class="facility-name">${lname(f.id)}</div><div class="facility-address">${addr(f)}</div></div><div style="display:flex;flex-direction:column;align-items:flex-end;gap:2px"><span class="status-badge ${st.cls}">${st.text}</span><span class="expand-hint" data-expand="${t('expand')}" data-collapse="${t('collapse')}"></span></div></div><div class="facility-body">${poolsHtml}<div class="schedule-section"><div class="schedule-title">${t('hours')}</div>${sessHtml}</div>${closureHtml}${official}</div></div>`;
  }).join("");
}

function renderPlayrooms(){
  const now=hkNow(),nm=hkMinutes(now);
  return(DD.playrooms||[]).map(p=>{
    let maint=parseMaintNote(p.note);let isMaint=isMaintDay(maint);let maintNow=isMaint&&nm<maint.shift;
    let st=maintNow?{text:t('maint'),cls:'status-maint'}:facilityOverallStatus(p.sessions,nm);
    let html=p.sessions.map(s=>{let r=parseRange(s);let ss=sessionStatus(r,nm);if(isMaint&&r&&r.start<maint.shift){ss={text:t('maint'),cls:'maint'};}return`<div class="session"><span class="session-time">${trSession(s,currentLang)}</span><span class="session-status ${ss.cls}">${ss.text}</span></div>`}).join("");
    let official=officialLink(p.officialUrl,'view');
    return`<div class="card collapsed" id="${p.id}"><div class="facility-header" onclick="toggleCard(this)"><div><div class="facility-name">${lname(p.id)}</div><div class="facility-address">${addr(p)} · ${p.theme} · ${p.area}</div></div><div style="display:flex;flex-direction:column;align-items:flex-end;gap:2px"><span class="status-badge ${st.cls}">${st.text}</span><span class="expand-hint" data-expand="${t('expand')}" data-collapse="${t('collapse')}"></span></div></div><div class="facility-body"><div class="schedule-section"><div class="schedule-title">${t('hours45')}</div>${html}</div><div class="notice">${tl('note',p.note)}</div>${official}</div></div>`;
  }).join("");
}

function renderLibraries(){
  const now=hkNow();let day=now.getDay();let today=LDAY[currentLang][day];
  return(DD.libraries||[]).map(l=>{
    let todayRow=l.weekly.find(w=>w.day===LDAY.zh[day]);let nm=hkMinutes(now);let r=todayRow?parseRange(todayRow.time):null;
    let st=r?sessionStatus(r,nm):{text:t('closed'),cls:"status-closed"};
    // 是日已結束（時段完結後）→ 休館，同泳池/運動場一致
    if(st.cls==="done") st={text:t('closed'),cls:"status-closed"};
    let badgeCls=st.cls==="open"?"status-open":st.cls==="soon"?"status-upcoming":"status-closed";
    let badgeText=st.text===t('open')?t('open'):st.text;
    let rows=l.weekly.map(w=>{let isToday=w.day===LDAY.zh[day];return`<div class="session" style="${isToday?'background:#f0fdf4;border-radius:6px;padding:6px 8px':''}"><span class="session-time">${trDay(w.day,currentLang)} ${w.time}${isToday?' ← '+t('today'):''}</span><span class="session-status ${isToday?st.cls:'done'}">${isToday?badgeText:''}</span></div>`}).join("");
    let official=officialLink(l.officialUrl,'viewLib');
    let warnHtml='';const lw=wWarn();if(lw.severe.length){warnHtml=`<div class="notice" style="background:#fee2e2;border-color:#fecaca;color:#991b1b">⚠️ ${t('weatherWarn')}：${lw.severe.join('、')} — ${t('libMayClose')}</div>`;}
    return`<div class="card collapsed" id="${l.id}"><div class="facility-header" onclick="toggleCard(this)"><div><div class="facility-name">${lname(l.id)}</div><div class="facility-address">${addr(l)}</div></div><div style="display:flex;flex-direction:column;align-items:flex-end;gap:2px"><span class="status-badge ${badgeCls}">${badgeText}</span><span class="expand-hint" data-expand="${t('expand')}" data-collapse="${t('collapse')}"></span></div></div><div class="facility-body"><div class="schedule-section"><div class="schedule-title">${t('libhours')}</div>${rows}</div>${warnHtml}${official}</div></div>`;
  }).join("");
}

 const overallMap={open:{cls:'status-open',text:t('open')},partial:{cls:'status-partial',text:t('partial')},closed:{cls:'status-suspended',text:t('closed_today')},unknown:{cls:'status-closed',text:t('closed')}};
 // 即時計算 overall：依目前時間兩場地嘅 code 推導（唔用 sync 時嘅靜態值）

   const cur=slots.find(x=>{const m=x.time.match(/(\d{1,2}):(\d{2})\s*-\s*(\d{1,2}):(\d{2})/);if(!m)return false;const s=parseInt(m[1])*60+parseInt(m[2]),e=parseInt(m[3])*60+parseInt(m[4]);return nowM>=s&&nowM<e;});
   if(!cur) return 'closed'; // 無現行時段 = 是日已結束

 }

     }

 }

 let tomLabel=(sd.tomorrowDate||'').replace(/^\d{4}\//,'');

 let allTimes=[...new Set([...(sd.mainField||[]).map(x=>x.time), ...(sd.secondaryField||[]).map(x=>x.time)])].sort();

 });

 // Closures
 let closures=(sd.closures||[]).map(c=>`<div class="notice" style="border-left:4px solid #dc2626">⚠️ ${t('closure')} — ${c.facilities||''} ${c.reason||''} ${c.time||''}</div>`).join('');
 // 定期保養日恆常告示

   maintInfo=`<div class="notice" style="background:#fee2e2;border-color:#fecaca">🧹 ${t("maintNotice")}：${t("mainField")} ${m.main} · ${t("secField")} ${m.sec}</div>`;
 }
 // Address with Google Maps
 let gmapUrl='https://www.google.com/maps/search/?api=1&query='+encodeURIComponent('將軍澳寶康路109號 Tseung Kwan O Sports Ground');
 // Official link + last updated
 let xlsxDate=sd.xlsxDate?` · ${t("xlsxDateLabel")}：${sd.xlsxDate}`:'';
 let xlsxFileDate=sd.xlsxFileDate?`<div style="font-size:.7rem;color:#94a3b8;margin-top:2px">${t("xlsxFileDateLabel")}：${sd.xlsxFileDate}</div>`:'';
 let official=`<div style="text-align:center;margin-top:10px"><a href="${sd.noticeUrl||'#'}" target="_blank" rel="noopener" style="font-size:.8rem;color:#1e3a8a;text-decoration:underline">${t("viewTimetable")} →${xlsxDate}</a>${xlsxFileDate}</div>`;
 return `<div class="card collapsed" id="sportground-card"><div class="facility-header" onclick="toggleCard(this)"><div><div class="facility-name">將軍澳運動場</div><div class="facility-address"><a href="${gmapUrl}" target="_blank" rel="noopener" style="color:#1e3a8a;text-decoration:none">將軍澳寶康路109號 📍</a> · 400m跑道</div></div><div style="display:flex;flex-direction:column;align-items:flex-end;gap:2px"><span class="status-badge ${overall.cls}">${overall.text}</span><span class="expand-hint" data-expand="${t('expand')}" data-collapse="${t('collapse')}"></span></div></div><div class="facility-body">${closures}${maintInfo}<div class="schedule-section" style="margin-top:0;padding-top:0;border-top:none">${header}${grid}</div>${legend}${official}</div></div>`;
}

function renderRVM(){
  const now=hkNow(),nm=hkMinutes(now);
  const items=(DD.rvm||[]).map(r=>{
    let cls='rvm-status-operating',txt=t('rvm_open');
    // 先計時段：非服務時間一律「非服務時間」（24小時例外）
    let inHours=true;
    if(r.hours!=='24小時'){const st=sessionStatus(parseRange(r.hours),nm);inHours=st.cls==='open'||st.cls==='soon';}
    if(!inHours){cls='rvm-status-maintenance';txt=t('rvm_closed');}
    else if(rvmData&&rvmData.machines&&rvmData.machines[r.name]){const m=rvmData.machines[r.name];if(m.cat==='full'){cls='rvm-status-full';txt=t('rvm_full');}else if(m.cat==='nearly_full'){cls='rvm-status-nearly-full';txt=t('rvm_nearly_full');}else if(m.cat==='maintenance'){cls='rvm-status-maintenance';txt=t('rvm_maint');}else{cls='rvm-status-operating';txt=t('rvm_open');}}
    else{cls='rvm-status-operating';txt=t('rvm_open');}
    return`<div class="rvm-item"><div class="rvm-info"><div class="rvm-name">${tl('rvm',r.name)}</div><div class="rvm-address">${addrRVM(r)}</div><div class="rvm-hours">${r.hours}</div></div><span class="rvm-status ${cls}">${txt}</span></div>`;
  }).join("");
  const syncTime=rvmData?rvmData.lastSync:now.toLocaleString('zh-HK',{hour12:false}).replace(/\//g,'-');
  return`<div class="rvm-card"><div class="rvm-grid">${items}</div><div class="rvm-sync">${t('sync')}：${syncTime}</div><div style="text-align:center;margin-top:8px"><a href="https://www.hkrvms3.com.hk/hk/" target="_blank" rel="noopener" style="font-size:.75rem;color:#1e3a8a;text-decoration:underline">hkrvms3.com.hk — ${t("rvmOfficialMap")} ↗</a></div></div>`;
}

function renderSportsCentres(){
  const now=hkNow(),nm=hkMinutes(now);
  return(DD.sports_centres||[]).map(f=>{
    let st=facilityOverallStatus(f.sessions,nm);
    let notice='';if(f.maintNotice){notice=`<div class="notice">🔧 ${currentLang==='en'?'Maintenance':currentLang==='cn'?'保养':'保養'}：${f.maintNotice}</div>`;}
    let sessions=f.sessions.map(s=>{let r=parseRange(s);let ss=sessionStatus(r,nm);return`<div class="session"><span class="session-time">${s}</span><span class="session-status ${ss.cls}">${ss.text}</span></div>`}).join("");
    return`<div class="card collapsed" id="${f.id}"><div class="facility-header" onclick="toggleCard(this)"><div><div class="facility-name">${lname(f.id)}</div><div class="facility-address">${addr(f)}</div></div><div style="display:flex;flex-direction:column;align-items:flex-end;gap:2px"><span class="status-badge ${st.cls}">${st.text}</span><span class="expand-hint" data-expand="${t('expand')}" data-collapse="${t('collapse')}"></span></div></div><div class="facility-body"><div class="schedule-section"><div class="schedule-title">${t('hours')}</div>${sessions}</div>${notice}</div></div>`;
  }).join("");
}

function renderTennisCourts(){
  const now=hkNow(),nm=hkMinutes(now);
  return(DD.tennis_courts||[]).map(f=>{
    const st=facilityOverallStatus(["07:00 - 23:00"],nm);
    return`<div class="card collapsed" id="${f.id}"><div class="facility-header" onclick="toggleCard(this)"><div><div class="facility-name">${lname(f.id)}</div><div class="facility-address">${addr(f)}</div></div><div style="display:flex;flex-direction:column;align-items:flex-end;gap:2px"><span class="status-badge ${st.cls}">${st.text}</span><span class="expand-hint" data-expand="${t('expand')}" data-collapse="${t('collapse')}"></span></div></div><div class="facility-body"><div class="detail-row"><span class="detail-label">${t('hours')}</span><span>07:00 - 23:00</span></div></div></div>`;
  }).join("");
}

function renderCyclingTracks(){
  const now=hkNow(),nm=hkMinutes(now);
  return(DD.cycling_tracks||[]).map(f=>{
    const st=facilityOverallStatus([f.hours],nm);
    const a=currentLang==='en'?(f.addrEn||f.addr):(currentLang==='cn'?(f.addrCn||f.addr):f.addr);
    return`<div class="card collapsed" id="${f.id}"><div class="facility-header" onclick="toggleCard(this)"><div><div class="facility-name">${f.name}</div><div class="facility-address">${a}</div></div><div style="display:flex;flex-direction:column;align-items:flex-end;gap:2px"><span class="status-badge ${st.cls}">${st.text}</span><span class="expand-hint" data-expand="${t('expand')}" data-collapse="${t('collapse')}"></span></div></div><div class="facility-body"><div class="detail-row"><span class="detail-label">${t('hours')}</span><span>${f.hours}</span></div><div class="detail-row"><span class="detail-label">${currentLang==='en'?'Phone':currentLang==='cn'?'电话':'電話'}</span><span>${f.phone}</span></div><div class="detail-row"><span class="detail-label">${currentLang==='en'?'Facilities':currentLang==='cn'?'設施':'設施'}</span><span>${f.facilities}</span></div></div></div>`;
  }).join("");
}

function renderFootballPitches(){
  return(DD.football_pitches||[]).map(f=>{
    const venues=f.venues.map(v=>`<div class="detail-row"><span class="detail-label">• ${v.name}</span><span style="font-size:.78rem;color:#64748b">${v.addr}</span></div>`).join("");
    return`<div class="card collapsed" id="${f.id}"><div class="facility-header" onclick="toggleCard(this)"><div><div class="facility-name">${lname(f.id)}</div><div class="facility-address">${currentLang==='en'?(f.type==='artificial'?'Artificial Turf':'Natural Grass'):(currentLang==='cn'?(f.type==='artificial'?'人造草地':'天然草地'):(f.type==='artificial'?'人造草地':'天然草地'))}</div></div><div style="display:flex;flex-direction:column;align-items:flex-end;gap:2px"><span class="expand-hint" data-expand="${t('expand')}" data-collapse="${t('collapse')}"></span></div></div><div class="facility-body">${venues}</div></div>`;
  }).join("");
}

function renderOtherFacilities(){
  return(DD.other_facilities||[]).map(f=>{
    const nm=currentLang==='en'?(f.nameEn||f.name):(currentLang==='cn'?(f.nameCn||f.name):f.name);
    const a=currentLang==='en'?(f.addrEn||f.addr):(currentLang==='cn'?(f.addrCn||f.addr):f.addr);
    return`<div class="card collapsed"><div class="facility-header" onclick="toggleCard(this)"><div><div class="facility-name">${nm}</div><div class="facility-address">${a}</div></div><div style="display:flex;flex-direction:column;align-items:flex-end;gap:2px"><span class="expand-hint" data-expand="${t('expand')}" data-collapse="${t('collapse')}"></span></div></div><div class="facility-body"></div></div>`;
  }).join("");
}

// === SAFE RENDER + RENDER ALL ===
function safeRender(elId,fn){const el=document.getElementById(elId);if(!el)return;try{el.innerHTML=fn();}catch(e){console.error(elId,e);if(!el.innerHTML.trim())el.innerHTML='<div class="notice" style="color:#b45309">⚠️ 數據暫時無法顯示</div>';}}
function renderAll(){
  if(DD.pools&&DD.pools.length)safeRender('pools',renderPools);
  if(DD.playrooms&&DD.playrooms.length)safeRender('playrooms',renderPlayrooms);
  if(DD.libraries&&DD.libraries.length)safeRender('libraries',renderLibraries);
  if(sportGroundData)safeRender('sportground-grid',renderSportGround);
  if(DD.rvm&&DD.rvm.length)safeRender('rvm-facilities',renderRVM);
  if(DD.sports_centres&&DD.sports_centres.length)safeRender('sports-centres',renderSportsCentres);
  if(DD.tennis_courts&&DD.tennis_courts.length)safeRender('tennis-courts',renderTennisCourts);
  if(DD.cycling_tracks&&DD.cycling_tracks.length)safeRender('cycling-tracks',renderCyclingTracks);
  if(DD.football_pitches&&DD.football_pitches.length)safeRender('football-pitches',renderFootballPitches);
  if(DD.other_facilities&&DD.other_facilities.length)safeRender('other-facilities',renderOtherFacilities);
  const cards=document.querySelectorAll('.card');cards.forEach((c,i)=>{c.style.animationDelay=(i*0.06)+'s';c.style.animation='cardIn .35s ease both';});
  updateClock();
}

// === INIT ===
const LAST_UPDATE=DD.last_update||'--';
const CATEGORY_MAP={
  swimming:{section:'swim',el:null,labelKey:'pools',icon:'🏊'},
  sportground:{section:'sportground',el:'sportground-grid',labelKey:'sportground',icon:'🏟️'},
  playroom:{section:'playroom',el:'playrooms',labelKey:'playrooms',icon:'🎮'},
  library:{section:'library',el:'libraries',labelKey:'library',icon:'📚'},
  rvm:{section:'rvm',el:'rvm-facilities',labelKey:'rvm',icon:'♻️'},
  sports_centre:{section:'sports',el:'sports-centres',labelKey:'sports',icon:'🏟️'},
  tennis:{section:'tennis',el:'tennis-courts',labelKey:'tennis',icon:'🎾'},
  cycling:{section:'cycling',el:'cycling-tracks',labelKey:'cycling',icon:'🚲'},
  football:{section:'football',el:'football-pitches',labelKey:'football',icon:'⚽'},
  other:{section:'other',el:'other-facilities',labelKey:'other',icon:'🎯'}
};
const CATEGORY_COUNTS={
  swimming:DD.pools?DD.pools.length:0,
  sportground:sportGroundData?1:0,
  playroom:DD.playrooms?DD.playrooms.length:0,
  library:DD.libraries?DD.libraries.length:0,
  rvm:DD.rvm?DD.rvm.length:0,
  sports_centre:DD.sports_centres?DD.sports_centres.length:0,
  tennis:DD.tennis_courts?DD.tennis_courts.length:0,
  cycling:DD.cycling_tracks?DD.cycling_tracks.length:0,
  football:DD.football_pitches?DD.football_pitches.length:0,
  other:DD.other_facilities?DD.other_facilities.length:0
};

function initPage(){
  const dist=DD.district||{};
  const title=(dist.name_zh_hant||'')+'康樂設施運作情況';
  document.getElementById('navTitle').textContent=title;
  document.title=title+' | HK Recreation Status';
  document.querySelector('meta[name="description"]').content=(dist.name_zh_hant||'')+'康樂設施即時運作狀態';

  // Build quickNav
  const cats=DD.categories||[];
  const quickNav=document.getElementById('quickNav');
  quickNav.innerHTML=cats.filter(c=>CATEGORY_COUNTS[c]>0).map(c=>{
    const m=CATEGORY_MAP[c];if(!m)return'';
    const label=t(m.labelKey);
    return`<a href="#${m.section}" class="index-item">${m.icon} ${label} (${CATEGORY_COUNTS[c]})</a>`;
  }).join('');

  // Show/hide sections + set titles
  for(const[c,m]of Object.entries(CATEGORY_MAP)){
    const sec=document.getElementById(m.section);
    if(!sec)continue;
    if(CATEGORY_COUNTS[c]>0){sec.style.display='';sec.querySelector('h2').innerHTML=t(m.labelKey)+' <span class="toggle"></span>';}
    else sec.style.display='none';
  }

  // Footer
  document.querySelector('#footer-updated').innerHTML=t('lastUpd')+'：<span id="lastUpdate">'+LAST_UPDATE+'</span> <span id="lastSyncAgo" style="color:#16a34a;font-weight:600"></span> · '+t('src')+'：'+(DD.data_sources||'康文署');
  document.querySelector('#footer-links').innerHTML='<a href="https://ko-fi.com/forumdata" target="_blank" rel="noopener" style="color:#f59e0b;text-decoration:none">☕ '+t('buyCoffee')+'</a>';
  updateSyncAgo();
}

function updateClock(){const now=hkNow();const y=now.getFullYear();const mon=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][now.getMonth()];const d=now.getDate();const wd=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][now.getDay()];const hh=String(now.getHours()).padStart(2,'0');const mm=String(now.getMinutes()).padStart(2,'0');document.getElementById('topDate').textContent=`${y}-${mon}-${d} (${wd}) ${hh}:${mm}`;}
function toggleSection(id){document.getElementById(id).classList.toggle('collapsed');}
function updateSyncAgo(){const[dd,tt]=LAST_UPDATE.split(' ');const[y,m,d]=dd.split('-').map(Number);const[hh,mm]=tt.split(':').map(Number);const syncTime=new Date(y,m-1,d,hh,mm);const diff=Math.floor((Date.now()-syncTime)/60000);const ago=diff<1?'剛剛':diff<60?diff+'分鐘前':diff<1440?Math.floor(diff/60)+'小時前':Math.floor(diff/1440)+'天前';const el=document.getElementById('lastSyncAgo');if(el)el.textContent='('+ago+')';}
function renderFooter(){document.querySelector('#footer-updated').innerHTML=t('lastUpd')+'：<span id="lastUpdate">'+LAST_UPDATE+'</span> <span id="lastSyncAgo" style="color:#16a34a;font-weight:600"></span> · '+t('src')+'：'+(DD.data_sources||'康文署');updateSyncAgo();document.getElementById('backToTop').setAttribute('aria-label',t('backToTop'));}

// Boot
initPage();loadRVM();loadSportGround();
setInterval(()=>{renderAll()},60000);
setInterval(updateClock,1000);updateClock();
document.getElementById('backToTop').onclick=()=>window.scrollTo({top:0,behavior:'smooth'});
document.querySelectorAll('.index-item').forEach(a=>a.addEventListener('click',e=>{e.preventDefault();const el=document.getElementById(a.getAttribute('href').slice(1));if(el){const off=88+document.getElementById('quickNav').getBoundingClientRect().height+8;window.scrollTo({top:el.getBoundingClientRect().top+scrollY-off,behavior:'smooth'});}}));
window.addEventListener('scroll',()=>{document.getElementById('backToTop').classList.toggle('visible',window.scrollY>300)});
document.querySelectorAll('.lang-btn').forEach(b=>b.addEventListener('click',e=>{e.preventDefault();currentLang=b.dataset.lang;document.querySelectorAll('.lang-btn').forEach(x=>x.classList.toggle('active',x===b));document.documentElement.lang=currentLang==='zh'?'zh-HK':currentLang==='cn'?'zh-CN':'en';initPage();renderAll();const ww=wWarn();const banner=document.getElementById('thunderBanner');if(banner&&ww.thunder.length){banner.innerHTML=`<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:middle;margin-right:4px"><path d="M19 16.9A5 5 0 0 0 18 7h-1.26a8 8 0 1 0-11.62 9"/><polyline points="13 11 9 17 15 17 11 23"/></svg> ⛈ ${ww.thunder.join('、')}${currentLang==='en'?' in effect':'生效中'}${currentLang==='en'?' — Pools may close':' — 泳池可能暫停開放'}`;}}));
</script>
